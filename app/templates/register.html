<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Online Education Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>

<body>

<div class="container">
    <h2>Create Your Account</h2>
    <p class="subtitle">Join the Online Education & Assessment Platform</p>

    <!-- ROLE SWITCH -->
   

    <form method="POST" action="/register">
         <div class="role-switch">
        <label>
            <input type="radio" name="role" value="student" checked>
            Student
        </label>
        <label>
            <input type="radio" name="role" value="teacher">
            Tutor / Teacher
        </label>
    </div>

        <!-- COMMON AUTH FIELDS -->
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password">
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password">
        </div>

        <!-- ================= STUDENT SECTION ================= -->
        <div id="studentForm" class="form-section active">

            <h3>Student Details</h3>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name">
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" name="age">
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender">
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="phone">
            </div>



 <div class="form-group">
                <label>Branch</label>
                <input type="text" name="course">
            </div>


 <div class="form-group">
                <label>Department</label>
                <input type="text" name="department">
            </div>

















            <div class="form-group">
                <label>Address</label>
                <textarea name="address"></textarea>
            </div>

            <div class="form-group">
                <label>Institute Name</label>
                <input type="text" name="institute_name">
            </div>

            <div class="form-group">
                <label>Year of Study</label>
                <input type="number" name="year_of_study">
            </div>

        </div>

        <!-- ================= TEACHER SECTION ================= -->
        <div id="teacherForm" class="form-section">

            <h3>Tutor / Teacher Details</h3>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name">
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" name="tutor_age">
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="tutor_gender">
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="tutor_phone">
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea name="tutor_address"></textarea>
            </div>

            <div class="form-group">
                <label>Department</label>
                <input type="text" name="department">
            </div>

            <div class="form-group">
                <label>Specialization</label>
                <input type="text" name="specialization">
            </div>

            <div class="form-group">
                <label>Institute Name</label>
                <input type="text" name="institute_name">
            </div>

            <div class="form-group">
                <label>Employee ID</label>
                <input type="text" name="employee_id">
            </div>

            <div class="form-group">
                <label>Joining Date</label>
                <input type="date" name="joining_date">
            </div>

            <p class="note">
                Tutor accounts require admin approval before activation.
            </p>
        </div>

        <button type="submit">Create Account</button>

        <p class="login-link">
            Already registered? <a href="/login">Login</a>
        </p>

    </form>
</div>

<script src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>
</html>

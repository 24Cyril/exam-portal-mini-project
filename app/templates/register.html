<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Online Education Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../static/css/register.css">
</head>

<body>

<div class="container">
    <h2>Account Registration</h2>
    <p class="subtitle">Register as Student or Tutor</p>

    <!-- ROLE SWITCH -->
    <div class="role-switch">
        <label>
            <input type="radio" name="role" value="student" checked>
            Student
        </label>
        <label>
            <input type="radio" name="role" value="tutor">
            Tutor / Teacher
        </label>
    </div>

    <form action="/register" method="POST">

        <!-- ================= STUDENT FORM ================= -->
        <div id="studentForm" class="form-section active">
            <input type="hidden" name="role" value="student">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="student_full_name" required>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" name="student_age" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="student_gender" required>
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="student_email" required>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="student_phone" required>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea name="student_address" required></textarea>
            </div>

            <div class="form-group">
                <label>Course Interested</label>
                <input type="text" name="course_interest" required>
            </div>
        </div>

        <!-- ================= TUTOR FORM ================= -->
        <div id="tutorForm" class="form-section">
            <input type="hidden" name="role" value="tutor">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" required>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" name="age" min="21" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="phone" required>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea name="address" required></textarea>
            </div>

            <div class="form-group">
                <label>Department</label>
                <input type="text" name="department" required>
            </div>

            <div class="form-group">
                <label>Specialization</label>
                <input type="text" name="specialization" required>
            </div>

            <div class="form-group">
                <label>Institute Name</label>
                <input type="text" name="institute_name" required>
            </div>

            <div class="form-group">
                <label>Employee ID</label>
                <input type="text" name="employee_id" required>
            </div>

            <div class="form-group">
                <label>Joining Date</label>
                <input type="date" name="joining_date" required>
            </div>
        </div>

        <button type="submit">Register</button>

        <p class="note">
            Tutor accounts require admin verification before activation.
        </p>
    </form>
</div>

<script src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>
</html>

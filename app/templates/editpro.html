<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Edit Profile</title>





  <link rel="stylesheet" href="/static/css/editpro.css">
</head>

<body>
  <div class="sidebar">
    <h2>Student Panel</h2>
    <ul>
      <li id="tab-home" onclick="openTab('home')">🏠 Home</li>
      <li id="tab-profile" class="active" onclick="openTab('profile')">👤 Profile</li>
      <li id="tab-courses" onclick="openTab('courses')">📚 Courses</li>
      <li id="tab-notes" onclick="openTab('notes')">📄 Notes</li>
      <li id="tab-exam" onclick="openTab('exam')">📝 Exam</li>
      <li id="tab-result" onclick="openTab('result')">📊 Result</li>
      <li id="tab-certificate" onclick="openTab('certificate')">🏅 Certificate</li>
      <li id="tab-messages" onclick="openTab('messages')">💬 Messages</li>
      <li id="tab-notifications" onclick="openTab('notifications')">🔔 Notifications</li>
      <li id="tab-payment" onclick="openTab('payment')">💳 Payment</li>
      <li id="tab-settings" onclick="openTab('settings')">⚙️ Settings</li>
      <li id="logout"><a href="/logout">🚪 Logout</a></li>
    </ul>
  </div>

  <div class="content">
    <h2 id="page-title">EDIT PROFILE</h2>
    <div class="card">
      <form id="profileForm" style="max-width:820px;">

        <h3>Personal Details</h3>
        <div class="row">
          <input type="text" name="full_name" placeholder="Full Name" value="{{ student.full_name or '' }}">
        </div>

        <div class="row">
          <input type="number" name="age" placeholder="Age" value="{{ student.age or '' }}">
          <select name="gender">
            <option value="">Gender</option>
            <option {% if student.gender=='Male' %}selected{% endif %}>Male</option>
            <option {% if student.gender=='Female' %}selected{% endif %}>Female</option>
            <option {% if student.gender=='Other' %}selected{% endif %}>Other</option>
          </select>
        </div>

        <div class="row">
          <input type="date" name="dob" placeholder="Date of Birth" value="{{ student.dob or '' }}">
          <input type="text" name="blood_group" placeholder="Blood Group" value="{{ student.blood_group or '' }}">
        </div>

        <div class="row">
          <input type="text" name="nationality" placeholder="Nationality" value="{{ student.nationality or '' }}">
          <input type="text" name="emergency_contact" placeholder="Emergency Contact"
            value="{{ student.emergency_contact or '' }}">
        </div>

        <h3>Contact & Address Details</h3>
        <div class="row">
          <input type="email" name="email" placeholder="Email" value="{{ student.email or '' }}" readonly>
          <input type="text" name="phone" placeholder="Phone" value="{{ student.phone or '' }}">
        </div>

        <textarea name="address" placeholder="Address">{{ student.address or '' }}</textarea>

        <div class="row">
          <input type="text" name="city" placeholder="City" value="{{ student.city or '' }}">
          <input type="text" name="state" placeholder="State" value="{{ student.state or '' }}">
        </div>

        <div class="row">
          <input type="text" name="pincode" placeholder="Pincode" value="{{ student.pincode or '' }}">
          <input type="text" name="country" placeholder="Country" value="{{ student.country or '' }}">
        </div>

        <h3>Academic Details</h3>
        <div class="row">
          <input type="text" name="course" placeholder="Course" value="{{ student.course or '' }}">
          <input type="text" name="department" placeholder="Department" value="{{ student.department or '' }}">
        </div>

        <div class="row">
          <input type="number" name="year_of_study" placeholder="Year of Study"
            value="{{ student.year_of_study or '' }}">
          <input type="number" name="semester" placeholder="Semester" value="{{ student.semester or '' }}">
        </div>

        <div class="row">
          <input type="text" name="institute_name" placeholder="Institute Name"
            value="{{ student.institute_name or '' }}" style="flex:2;">
          <input type="text" name="roll_number" placeholder="Roll Number" value="{{ student.roll_number or '' }}">
        </div>

        <div style="display:flex; gap:10px; margin-top:12px;">
          <button type="submit" class="update-btn">Save Profile</button>
          <a href="/student" class="update-btn" style="background:#6b7280;">Back to Dashboard</a>
        </div>

        <p id="statusMsg"></p>
      </form>
    </div>
  </div>

  <script src="/static/js/editpro.js"></script>

</body>

</html>

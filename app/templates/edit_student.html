<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>
    <link rel="stylesheet" href="../static/css/admin.css">
</head>
<body>

<div class="form-card">
    <h2>Edit Student</h2>
    <form method="POST">
        <input type="text" name="full_name" placeholder="Full Name" value="{{ student.full_name }}" required>
        <input type="email" name="email" placeholder="Email" value="{{ student.email }}" required>
        <input type="tel" name="phone" placeholder="Phone Number" value="{{ student.phone }}" required>
        
        <select name="gender" required>
            <option value="">Select Gender</option>
            <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if student.gender == 'Other' %}selected{% endif %}>Other</option>
        </select>
        
        <input type="text" name="course" placeholder="Course" value="{{ student.course }}" required>
        <input type="text" name="department" placeholder="Department" value="{{ student.department }}" required>
        
        <select name="year" required>
            <option value="">Select Year</option>
            <option value="1" {% if student.year_of_study == 1 %}selected{% endif %}>1st Year</option>
            <option value="2" {% if student.year_of_study == 2 %}selected{% endif %}>2nd Year</option>
            <option value="3" {% if student.year_of_study == 3 %}selected{% endif %}>3rd Year</option>
            <option value="4" {% if student.year_of_study == 4 %}selected{% endif %}>4th Year</option>
        </select>
        
        <button type="submit">Update Student</button>
    </form>
    
    <a href="/admin" class="back-link">← Back to Dashboard</a>
</div>

</body>
</html>

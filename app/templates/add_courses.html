<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Course — Admin</title>





    <link rel="stylesheet" href="/static/css/add_courses.css">
</head>

<body>

    <div class="sidebar">
        <h2 class="logo">Admin Panel</h2>
        <ul class="nav-list">
            <li><a href="/teacher">🏠 Home</a></li>
            <li><a href="/teacher/update">👤 Profile</a></li>
            <li><a href="/teacher/students">🎓 Students</a></li>
            <li class="active"><a href="/teacher/courses">📚 Student Courses</a></li>
            <li><a href="/teacher/enrollments">📝 Registration</a></li>
            <li><a href="/teacher/exams">🧪 Exam</a></li>
            <li><a href="/teacher/registrations">📊 Result</a></li>
            <li><a href="/teacher/payments">💳 Payment</a></li>
            <li class="logout"><a href="/logout">🚪 Logout</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h2 id="tab-title">Add Course</h2>
        <div class="card">
            <form method="post" action="/teacher/add-course" style="max-width:820px;">
                <label class="small">Course Name *</label>
                <input name="course_name" placeholder="Course Name" required>

                <label class="small">Course Code *</label>
                <input name="course_code" placeholder="Course Code" required>

                <label class="small">Department</label>
                <input name="department" placeholder="Department">

                <label class="small">Description</label>
                <textarea name="description" placeholder="Course Description" rows="4"></textarea>

                <label class="small">Duration</label>
                <input name="duration" placeholder="Duration (e.g., 6 months)">

                <label class="small">Fee *</label>
                <input name="fee" placeholder="Fee" type="number" step="0.01" required>

                <label class="small">Status</label>
                <select name="status">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>

                <div style="margin-top:12px; display:flex; gap:10px;">
                    <button type="submit" class="update-btn">Add Course</button>
                    <a href="/teacher" class="update-btn" style="background:#6b7280;">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
